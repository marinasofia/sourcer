# Only pods in this namespace (and kubectl port-forward) reach the service;
# the pod itself may only resolve names and call HTTPS (the model API).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sourcer
spec:
  podSelector:
    matchLabels:
      app: sourcer
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8500
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
