[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcer-jobs"
version = "0.2.0"
description = "Finds early career roles worth applying to: reads company job boards, drops what cannot fit with rules, and has Claude score the rest against the candidate's own evidence."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Marina Martin" }]
keywords = ["job-search", "langgraph", "anthropic", "claude", "llm", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business",
]
dependencies = [
  "anthropic>=0.40,<2",
  "beautifulsoup4>=4.12,<5",
  "langgraph>=0.2,<2",
  "mcp>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]
browser = ["playwright>=1.50,<2"]
# sourcer init and sourcer facts: read PDF and DOCX resumes
onboard = ["pypdf>=6.0,<7", "python-docx>=1.1,<2"]
snowflake = [
  "snowflake-connector-python>=4.0,<5",
  "cryptography>=50",   # PYSEC-2026-35/36/2141/3552/3553/3554, GHSA-537c-gmf6-5ccf
  "pyopenssl>=26",      # PYSEC-2026-2268/2269
]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-requests>=2.31",
  "types-beautifulsoup4>=4.12",
]

[project.urls]
Homepage = "https://github.com/marinasofia/sourcer"
Repository = "https://github.com/marinasofia/sourcer"
Issues = "https://github.com/marinasofia/sourcer/issues"
Changelog = "https://github.com/marinasofia/sourcer/blob/main/CHANGELOG.md"

[project.scripts]
sourcer = "sourcer.main:main"

[tool.setuptools.packages.find]
include = ["sourcer*"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs", "deploy"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "B",         # bugbear
  "UP",        # pyupgrade
  "SIM",       # simplify
  "C4",        # comprehensions
  "RUF",       # ruff-specific
  "T20",       # no stray print() in library code
  "S",         # bandit security checks
  "PL",        # pylint subset
]
ignore = [
  "PLR0913",   # many-arguments: the LLM helpers take (client, posting, skills, usage)
  "PLR2004",   # magic values in comparisons are documented inline
  "S101",      # asserts are fine in tests (also excluded per-file below)
  "S311",      # random is not used for crypto anywhere
  "RUF012",    # mutable class attributes: only in TypedDict state
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "T20"]
"sourcer/main.py" = ["T20"]         # CLI entry points print by design
"sourcer/track.py" = ["T20"]
"sourcer/evaluate.py" = ["T20"]
"sourcer/batch.py" = ["T20"]
"sourcer/rescore.py" = ["T20"]
"sourcer/rescreen.py" = ["T20"]
"sourcer/restore.py" = ["T20"]
"sourcer/score_listings.py" = ["T20"]
"sourcer/probe/__init__.py" = ["T20"]
"sourcer/discovery/cli.py" = ["T20"]
"sourcer/bot/telegram.py" = ["T20"]
"sourcer/orchestrator.py" = ["T20"]
"sourcer/apply/verify.py" = ["T20"]
"sourcer/export.py" = ["T20"]
"sourcer/export_public.py" = ["T20"]
"sourcer/export_showcase.py" = ["T20"]
"sourcer/alerts.py" = ["T20"]
"sourcer/snowdb.py" = ["T20"]
"sourcer/trust.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["sourcer"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
packages = ["sourcer"]
strict_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["langgraph.*", "bs4", "boto3", "snowflake.*", "mcp.*", "docx", "docx.*", "playwright.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:sourcer.*"]
markers = ["integration: exercises real network or a live API (skipped by default)"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["sourcer"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
  "def main\\(",
]
