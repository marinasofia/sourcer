version: 2
updates:
  - package-ecosystem: pip
    directory: /security
    schedule:
      interval: monthly
    groups:  # one PR a month for the scanners
      security-tools:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "security"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      runtime:
        patterns: ["*"]
        exclude-patterns: ["pytest*", "ruff", "mypy", "hypothesis", "pre-commit", "types-*"]
      dev-tooling:
        patterns: ["pytest*", "ruff", "mypy", "hypothesis", "pre-commit", "types-*"]
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/New_York
    groups:  # one PR a month for every action
      actions:
        patterns: ["*"]
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "docker"
