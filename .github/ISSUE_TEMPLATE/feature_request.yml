name: Feature request
description: Propose a change to the pipeline, a source, a rule, or a deployment surface
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and who hits it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Mention cost impact if it adds model calls.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This change does not move per-posting scores, skill gaps, or resume content into the public repository or dashboard.
          required: true
