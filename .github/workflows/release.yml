name: Release

# Cut a release by pushing a tag: git tag -a v0.2.0 -m v0.2.0 && git push --tags
# The tag must match the version in pyproject.toml and have a section in
# CHANGELOG.md; the job fails otherwise, so a release never ships unlogged.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job publishes the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$tag" = "$version" ] || { echo "tag v$tag does not match pyproject version $version"; exit 1; }
      - name: extract changelog section
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          [ -s /tmp/notes.md ] || { echo "no CHANGELOG.md section for $tag"; exit 1; }
          cat /tmp/notes.md
      - name: build
        run: |
          python -m pip install --quiet --require-hashes -r requirements-release.txt
          python -m build --no-isolation
          python -m twine check dist/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: /tmp/notes.md
          files: dist/*
          generate_release_notes: false
